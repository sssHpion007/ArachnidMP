name: Release Portable Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri Desktop Portable
        shell: cmd
        run: |
          call npx tauri build --no-bundle > build.log 2>&1
          if %ERRORLEVEL% neq 0 (
            type build.log
            exit /b %ERRORLEVEL%
          )

      - name: Publish Failure Log
        if: failure()
        uses: softprops/action-gh-release@v2
        with:
          files: build.log
          tag_name: ${{ github.ref_name || 'v0.1.0' }}
          name: Build Failed ${{ github.ref_name || 'v0.1.0' }}
          draft: false
          prerelease: true
          body: |
            Build failed on Windows runner. Log attached.
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare Portable Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $ver = "${{ github.ref_name }}"
          if (-not $ver) { $ver = "v0.1.0" }
          if (Test-Path "src-tauri/target/release/arachnid.exe") {
            Copy-Item "src-tauri/target/release/arachnid.exe" -Destination "artifacts/Arachnid-Portable.exe"
            Compress-Archive -Path "src-tauri/target/release/arachnid.exe" -DestinationPath "artifacts/Arachnid-$ver-Windows-Portable.zip"
            Write-Host "Created Arachnid-Portable.exe and zip for $ver!"
          } else {
            Write-Error "arachnid.exe was not found in release target!"
          }
          Get-ChildItem artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name || 'v0.1.0' }}
          name: Arachnid Music Player ${{ github.ref_name || 'v0.1.0' }} [Windows]
          draft: false
          prerelease: false
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
