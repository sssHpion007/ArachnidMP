name: Release Portable Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri Desktop Portable
        shell: pwsh
        run: |
          npx tauri build --no-bundle 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            "### ❌ Tauri Build Failed (Last 150 lines):" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content build.log -Tail 150 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }

      - name: Prepare Portable Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          $ver = "${{ github.ref_name }}"
          if (-not $ver) { $ver = "v0.1.0" }
          if (Test-Path "src-tauri/target/release/arachnid.exe") {
            Copy-Item "src-tauri/target/release/arachnid.exe" -Destination "artifacts/Arachnid-Portable.exe"
            Compress-Archive -Path "src-tauri/target/release/arachnid.exe" -DestinationPath "artifacts/Arachnid-$ver-Windows-Portable.zip"
            Write-Host "Created Arachnid-Portable.exe and zip for $ver!"
          } else {
            Write-Error "arachnid.exe was not found in release target!"
          }
          Get-ChildItem artifacts

      - name: Publish GitHub Release
        shell: bash
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          gh release delete "${{ github.ref_name }}" --yes --cleanup-tag=false || true
          gh release create "${{ github.ref_name }}" artifacts/* \
            --title "Arachnid Music Player ${{ github.ref_name }} [Windows]" \
            --notes-file RELEASE_NOTES.md \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
