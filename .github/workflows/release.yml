name: Release Portable Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri Desktop Portable
        run: npx tauri build --no-bundle

      - name: Prepare Portable Artifacts
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts
          if (Test-Path "src-tauri/target/release/arachnid.exe") {
            Copy-Item "src-tauri/target/release/arachnid.exe" -Destination "artifacts/Arachnid-Portable.exe"
            Compress-Archive -Path "src-tauri/target/release/arachnid.exe" -DestinationPath "artifacts/Arachnid-v0.1.0-Windows-Portable.zip"
            Write-Host "Created Arachnid-Portable.exe and zip!"
          } else {
            Write-Error "arachnid.exe was not found in release target!"
          }
          Get-ChildItem artifacts

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          files: artifacts/*
          tag_name: ${{ github.ref_name || 'v0.1.0' }}
          name: Arachnid Music Player v0.1.0 (Windows Portable)
          draft: false
          prerelease: false
          body: |
            ## Arachnid Music Player v0.1.0 🎵 (Portable for Windows)

            ### 🚀 Скачать портативную версию:
            * **Arachnid-v0.1.0-Windows-Portable.zip** — Скачайте архив, распакуйте в любую папку и запустите `arachnid.exe`. Установка не требуется!
            * **Arachnid-Portable.exe** — Одиночный запускаемый файл плеера.

            ### ✨ Возможности:
            * **Material You 3 Динамическая Темизация:** интерфейс адаптирует палитру под обложку текущего трека (Dark / AMOLED / Light).
            * **Десктопный UX в стиле MusicBee:**
              * Drag-and-Drop аудиофайлов прямо в окно из проводника.
              * Честное множественное выделение (`Shift+Click`, `Ctrl+Click`, `Ctrl+A`).
              * Перетаскивание треков прямо на плейлисты в сайдбаре.
              * Пакетный редактор ID3-тегов нескольких треков сразу.
            * **Встроенный Discord RPC:** статус трека, исполнителя и таймер в вашем профиле Discord.
            * **10-полосный эквалайзер** с пресетами и спектральным визуализатором.
            * **Легковесность и скорость:** ядро на Rust (Tauri 2.0).
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
