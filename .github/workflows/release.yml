name: Release Portable Windows

on:
  push:
    branches:
      - 'arena/da9dc431-arachnidmp'
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (for example v0.4.72)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri Desktop Portable
        shell: pwsh
        run: |
          npx tauri build --no-bundle 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            "### ❌ Tauri Build Failed (Last 150 lines):" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content build.log -Tail 150 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }

      - name: Smoke test Windows executable startup
        shell: pwsh
        run: |
          $exePath = Join-Path $PWD "src-tauri/target/release/arachnid.exe"
          if (-not (Test-Path $exePath)) {
            throw "arachnid.exe was not found for startup smoke test."
          }
          $process = $null
          $stdoutLog = Join-Path $env:TEMP "Arachnid-startup-$PID.out.log"
          $stderrLog = Join-Path $env:TEMP "Arachnid-startup-$PID.err.log"
          try {
            $process = Start-Process -FilePath $exePath -PassThru -RedirectStandardOutput $stdoutLog -RedirectStandardError $stderrLog
            Start-Sleep -Seconds 15
            $process.Refresh()
            if ($process.HasExited) {
              $stdoutText = if (Test-Path $stdoutLog) { Get-Content $stdoutLog -Raw } else { "" }
              $stderrText = if (Test-Path $stderrLog) { Get-Content $stderrLog -Raw } else { "" }
              throw "arachnid.exe exited during startup smoke test with code $($process.ExitCode). stdout=$stdoutText stderr=$stderrText"
            }
            Write-Host "arachnid.exe remained running for 15 seconds."

            $shell = New-Object -ComObject WScript.Shell
            if (-not $shell.AppActivate($process.Id)) { throw "Could not focus the player to test Shift+T." }
            Start-Sleep -Milliseconds 500
            $shell.SendKeys('{ESC}')
            Start-Sleep -Milliseconds 300
            $shell.SendKeys('+T')
            $deadline = [DateTime]::UtcNow.AddSeconds(10)
            $lyricsWindowFound = $false
            while ([DateTime]::UtcNow -lt $deadline) {
              if ($shell.AppActivate('Arachnid Lyrics')) { $lyricsWindowFound = $true; break }
              Start-Sleep -Milliseconds 200
            }
            if (-not $lyricsWindowFound) { throw "Shift+T did not show a separate Arachnid Lyrics window." }
            Start-Sleep -Milliseconds 300
            $shell.SendKeys('%{F4}')
            Start-Sleep -Seconds 1
            $process.Refresh()
            if ($process.HasExited) { throw "Closing the lyrics window also exited the player." }
            if ($shell.AppActivate('Arachnid Lyrics')) { throw "The lyrics window remained activatable after closing." }
            Write-Host "Shift+T opened the separate lyrics window; closing it left the player running."
          } catch {
            $stdoutText = if (Test-Path $stdoutLog) { Get-Content $stdoutLog -Raw } else { "" }
            $stderrText = if (Test-Path $stderrLog) { Get-Content $stderrLog -Raw } else { "" }
            $message = "$($_.Exception.Message) stdout=$stdoutText stderr=$stderrText" -replace "`r|`n", " "
            Write-Output "::error title=Lyrics window smoke failure::$message"
            throw
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
            Remove-Item $stdoutLog, $stderrLog -Force -ErrorAction SilentlyContinue
          }

      - name: Smoke test in-place updater replacement and rollback safety
        shell: pwsh
        run: |
          try {
            $builtExe = Join-Path $PWD "src-tauri/target/release/arachnid.exe"
            if (-not (Test-Path $builtExe)) { throw "arachnid.exe was not found for updater smoke test." }
            $testRoot = Join-Path $env:TEMP "ArachnidUpdaterSmoke-$PID"
            New-Item -ItemType Directory -Force -Path $testRoot | Out-Null
            $target = Join-Path $testRoot "arachnid.exe"
            $source = Join-Path $testRoot ".update-smoke.tmp"
            $backup = "$target.old.smoke"
            $scriptPath = Join-Path $testRoot "updater-smoke.ps1"
            $errorPath = Join-Path $testRoot "update-error.txt"
            $successPath = Join-Path $testRoot "update-success.txt"
            $logPath = Join-Path $testRoot "updater.log"
            Copy-Item $builtExe $target
            Copy-Item $builtExe $source
            function Escape-PSLiteral([string] $value) { return $value.Replace("'", "''") }
            $script = Get-Content "src-tauri/updater.ps1" -Raw
            $script = $script.Replace("__TARGET__", (Escape-PSLiteral $target))
            $script = $script.Replace("__SOURCE__", (Escape-PSLiteral $source))
            $script = $script.Replace("__BACKUP__", (Escape-PSLiteral $backup))
            $script = $script.Replace("__SCRIPT__", (Escape-PSLiteral $scriptPath))
            $script = $script.Replace("__ERROR__", (Escape-PSLiteral $errorPath))
            $script = $script.Replace("__SUCCESS__", (Escape-PSLiteral $successPath))
            $script = $script.Replace("__LOG__", (Escape-PSLiteral $logPath))
            $parent = Start-Process -FilePath $env:ComSpec -ArgumentList @('/c', 'ping 127.0.0.1 -n 60 >nul') -PassThru -WindowStyle Hidden
            $script = $script.Replace("__PARENT_PID__", [string]$parent.Id)
            [IO.File]::WriteAllText($scriptPath, $script, [Text.UTF8Encoding]::new($true))
            $startInfo = [Diagnostics.ProcessStartInfo]::new()
            $startInfo.FileName = "powershell.exe"
            $startInfo.Arguments = "-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$scriptPath`""
            $startInfo.UseShellExecute = $false
            $startInfo.CreateNoWindow = $true
            $updater = [Diagnostics.Process]::Start($startInfo)
            Stop-Process -Id $parent.Id -Force
            Start-Sleep -Seconds 3
            if (-not (Test-Path $backup)) { throw "Updater discarded its backup before validating the replacement." }
            if (-not $updater.WaitForExit(45000)) { Stop-Process -Id $updater.Id -Force; throw "Updater helper timed out." }
            if (-not (Test-Path $successPath)) {
              $reason = if (Test-Path $errorPath) { Get-Content $errorPath -Raw } else { "No updater completion marker was written." }
              Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $target } | Stop-Process -Force -ErrorAction SilentlyContinue
              Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue
              throw "Updater smoke test failed: $reason"
            }
            if (-not (Test-Path $logPath) -or -not (Select-String -Path $logPath -Pattern "update succeeded" -Quiet)) {
              throw "Updater did not leave a successful diagnostic trace."
            }
            if ((Test-Path $source) -or (Test-Path $backup) -or -not (Test-Path $target)) {
              $updatedProcessId = [int](Get-Content $successPath -Raw)
              Stop-Process -Id $updatedProcessId -Force -ErrorAction SilentlyContinue
              Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue
              throw "Updater did not finish cleanly (source, backup, or target state is wrong)."
            }
            $updatedProcessId = [int](Get-Content $successPath -Raw)
            Stop-Process -Id $updatedProcessId -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            # Force the replacement executable to fail at launch and verify the original is restored.
            $rollbackRoot = Join-Path $testRoot "rollback"
            New-Item -ItemType Directory -Force -Path $rollbackRoot | Out-Null
            $rollbackTarget = Join-Path $rollbackRoot "arachnid.exe"
            $rollbackSource = Join-Path $rollbackRoot ".update-invalid.tmp"
            $rollbackBackup = "$rollbackTarget.old.rollback"
            $rollbackScriptPath = Join-Path $rollbackRoot "updater-rollback.ps1"
            $rollbackErrorPath = Join-Path $rollbackRoot "update-error.txt"
            $rollbackSuccessPath = Join-Path $rollbackRoot "update-success.txt"
            $rollbackLogPath = Join-Path $rollbackRoot "updater.log"
            Copy-Item $builtExe $rollbackTarget
            [IO.File]::WriteAllBytes($rollbackSource, [byte[]](0x4D, 0x5A, 0x00, 0x00))
            $rollbackScript = Get-Content "src-tauri/updater.ps1" -Raw
            $rollbackScript = $rollbackScript.Replace("__TARGET__", (Escape-PSLiteral $rollbackTarget))
            $rollbackScript = $rollbackScript.Replace("__SOURCE__", (Escape-PSLiteral $rollbackSource))
            $rollbackScript = $rollbackScript.Replace("__BACKUP__", (Escape-PSLiteral $rollbackBackup))
            $rollbackScript = $rollbackScript.Replace("__SCRIPT__", (Escape-PSLiteral $rollbackScriptPath))
            $rollbackScript = $rollbackScript.Replace("__ERROR__", (Escape-PSLiteral $rollbackErrorPath))
            $rollbackScript = $rollbackScript.Replace("__SUCCESS__", (Escape-PSLiteral $rollbackSuccessPath))
            $rollbackScript = $rollbackScript.Replace("__LOG__", (Escape-PSLiteral $rollbackLogPath))
            $rollbackParent = Start-Process -FilePath $env:ComSpec -ArgumentList @('/c', 'ping 127.0.0.1 -n 60 >nul') -PassThru -WindowStyle Hidden
            $rollbackScript = $rollbackScript.Replace("__PARENT_PID__", [string]$rollbackParent.Id)
            [IO.File]::WriteAllText($rollbackScriptPath, $rollbackScript, [Text.UTF8Encoding]::new($true))
            $rollbackStart = [Diagnostics.ProcessStartInfo]::new()
            $rollbackStart.FileName = "powershell.exe"
            $rollbackStart.Arguments = "-NoLogo -NoProfile -NonInteractive -ExecutionPolicy Bypass -WindowStyle Hidden -File `"$rollbackScriptPath`""
            $rollbackStart.UseShellExecute = $false
            $rollbackStart.CreateNoWindow = $true
            $rollbackUpdater = [Diagnostics.Process]::Start($rollbackStart)
            Stop-Process -Id $rollbackParent.Id -Force
            if (-not $rollbackUpdater.WaitForExit(45000)) { Stop-Process -Id $rollbackUpdater.Id -Force; throw "Rollback helper timed out." }
            if (-not (Test-Path $rollbackErrorPath) -or (Test-Path $rollbackBackup) -or (Test-Path $rollbackSource)) {
              throw "Updater rollback did not complete or left staged files behind."
            }
            if (-not (Test-Path $rollbackLogPath) -or -not (Select-String -Path $rollbackLogPath -Pattern "Rollback restored the original executable" -Quiet)) {
              throw "Updater rollback diagnostic trace did not record the restored original executable."
            }
            $originalHash = (Get-FileHash $builtExe -Algorithm SHA256).Hash
            $restoredHash = (Get-FileHash $rollbackTarget -Algorithm SHA256).Hash
            if ($originalHash -ne $restoredHash) { throw "Updater did not restore the exact original executable." }
            Start-Sleep -Seconds 1
            Get-Process -ErrorAction SilentlyContinue | Where-Object { $_.Path -eq $rollbackTarget } | Stop-Process -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
            Remove-Item $testRoot -Recurse -Force -ErrorAction SilentlyContinue
            Write-Host "Updater completed a Windows replacement and restored the exact old executable after a failed launch."
          } catch {
            $message = $_.Exception.Message -replace "`r|`n", " "
            Write-Output "::error title=Updater smoke failure::$message"
            throw
          }

      - name: Upload Windows test build
        if: github.ref == 'refs/heads/arena/da9dc431-arachnidmp'
        uses: actions/upload-artifact@v4
        with:
          name: Arachnid-v0.4.79-Windows-Test
          path: src-tauri/target/release/arachnid.exe
          if-no-files-found: error

      - name: Prepare Portable Artifacts
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag '$env:RELEASE_TAG'. Expected vMAJOR.MINOR.PATCH."
          }
          New-Item -ItemType Directory -Force -Path artifacts
          if (Test-Path "src-tauri/target/release/arachnid.exe") {
            Copy-Item "src-tauri/target/release/arachnid.exe" -Destination "artifacts/Arachnid-Portable.exe"
            Compress-Archive -Path "src-tauri/target/release/arachnid.exe" -DestinationPath "artifacts/Arachnid-${env:RELEASE_TAG}-Windows-Portable.zip"
            Write-Host "Created Arachnid-Portable.exe and zip for $env:RELEASE_TAG!"
          } else {
            Write-Error "arachnid.exe was not found in release target!"
          }
          Get-ChildItem artifacts

      - name: Publish GitHub Release
        shell: bash
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag '$RELEASE_TAG'. Expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" artifacts/* --clobber
          else
            gh release create "$RELEASE_TAG" artifacts/* \
              --target "$GITHUB_SHA" \
              --title "Arachnid Music Player $RELEASE_TAG [Windows]" \
              --notes-file RELEASE_NOTES.md \
              --latest
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
