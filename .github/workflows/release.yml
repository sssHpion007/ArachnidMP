name: Release Portable Windows

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release version tag (for example v0.4.72)'
        required: true
        type: string

permissions:
  contents: write

env:
  RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install dependencies
        run: npm install

      - name: Build Web Frontend
        run: npm run build

      - name: Build Tauri Desktop Portable
        shell: pwsh
        run: |
          npx tauri build --no-bundle 2>&1 | Tee-Object -FilePath build.log
          if ($LASTEXITCODE -ne 0) {
            "### ❌ Tauri Build Failed (Last 150 lines):" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            Get-Content build.log -Tail 150 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            '```' | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8
            exit 1
          }

      - name: Smoke test Windows executable startup
        shell: pwsh
        run: |
          $exePath = Join-Path $PWD "src-tauri/target/release/arachnid.exe"
          if (-not (Test-Path $exePath)) {
            throw "arachnid.exe was not found for startup smoke test."
          }
          $process = $null
          try {
            $process = Start-Process -FilePath $exePath -PassThru
            Start-Sleep -Seconds 15
            $process.Refresh()
            if ($process.HasExited) {
              throw "arachnid.exe exited during startup smoke test with code $($process.ExitCode)."
            }
            Write-Host "arachnid.exe remained running for 15 seconds."
          } finally {
            if ($process -and -not $process.HasExited) {
              Stop-Process -Id $process.Id -Force
            }
          }

      - name: Prepare Portable Artifacts
        shell: pwsh
        run: |
          if ($env:RELEASE_TAG -notmatch '^v\d+\.\d+\.\d+$') {
            throw "Invalid release tag '$env:RELEASE_TAG'. Expected vMAJOR.MINOR.PATCH."
          }
          New-Item -ItemType Directory -Force -Path artifacts
          if (Test-Path "src-tauri/target/release/arachnid.exe") {
            Copy-Item "src-tauri/target/release/arachnid.exe" -Destination "artifacts/Arachnid-Portable.exe"
            Compress-Archive -Path "src-tauri/target/release/arachnid.exe" -DestinationPath "artifacts/Arachnid-${env:RELEASE_TAG}-Windows-Portable.zip"
            Write-Host "Created Arachnid-Portable.exe and zip for $env:RELEASE_TAG!"
          } else {
            Write-Error "arachnid.exe was not found in release target!"
          }
          Get-ChildItem artifacts

      - name: Publish GitHub Release
        shell: bash
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag '$RELEASE_TAG'. Expected vMAJOR.MINOR.PATCH." >&2
            exit 1
          fi
          gh release create "$RELEASE_TAG" artifacts/* \
            --target "$GITHUB_SHA" \
            --title "Arachnid Music Player $RELEASE_TAG [Windows]" \
            --notes-file RELEASE_NOTES.md \
            --latest
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
