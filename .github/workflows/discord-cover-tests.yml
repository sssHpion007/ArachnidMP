name: Rust regression tests

on:
  push:
    branches:
      - 'arena/6fcee020-arachnidmp'

jobs:
  rust-regression-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libasound2-dev \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Test Discord cover selection and activity invariants
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib discord::tests -- --nocapture

      - name: Test Discord cached-cover readiness retry
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib discord_cover_prepare_tests -- --nocapture

      - name: Test SQLite library repository
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib library_db::tests -- --nocapture

      - name: Test retired library index cleanup
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib storage::storage_tests -- --nocapture

      - name: Test SQLite cover cache
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib cover_cache::tests -- --nocapture

      - name: Test external plugin manifest and trust checks
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib plugins::tests -- --nocapture

      - name: Test external input path and URL validation
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib input_validation_tests -- --nocapture

      - name: Test portable updater transaction and rollback safety
        run: cargo test --manifest-path src-tauri/Cargo.toml --lib portable_updater::tests -- --nocapture
