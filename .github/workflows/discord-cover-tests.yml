name: Discord cover provider tests

on:
  push:
    branches:
      - 'arena/6fcee020-arachnidmp'

jobs:
  discord-cover-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'

      - name: Install Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes \
            build-essential \
            curl \
            file \
            libayatana-appindicator3-dev \
            libgtk-3-dev \
            librsvg2-dev \
            libssl-dev \
            libwebkit2gtk-4.1-dev \
            libxdo-dev \
            patchelf \
            wget

      - name: Test Discord cover selection and activity invariants
        shell: bash
        run: |
          set +e
          cargo test --manifest-path src-tauri/Cargo.toml --lib discord::tests -- --nocapture 2>&1 | tee discord-tests.log
          test_exit_code=${PIPESTATUS[0]}
          set -e
          if [ "$test_exit_code" -ne 0 ]; then
            tail -n 80 discord-tests.log | tee -a "$GITHUB_STEP_SUMMARY"
            diagnostic=$(tail -n 80 discord-tests.log | tr '\n' ' ' | sed 's/%/%25/g')
            if [ "${#diagnostic}" -gt 8000 ]; then diagnostic=${diagnostic: -8000}; fi
            echo "::error title=Discord cover tests failed::$diagnostic"
            exit "$test_exit_code"
          fi

      - name: Upload Discord test diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Discord-Cover-Test-Log-${{ github.run_number }}-${{ github.sha }}
          path: discord-tests.log
          if-no-files-found: ignore
          retention-days: 7
