[package]
name = "arachnid"
version = "0.3.86"
description = "Arachnid Music Player - Modern Material You 3 Player with MusicBee Power"
authors = ["sssHpion007"]
edition = "2021"

[lib]
name = "arachnid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
lofty = "0.21"
walkdir = "2.4"
base64 = "0.22"
rfd = "0.15"
ureq = { version = "2.10", default-features = false, features = ["tls", "native-certs"] }
