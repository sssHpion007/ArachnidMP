[package]
name = "arachnid"
version = "0.1.0"
description = "Arachnid Music Player - Modern Material You 3 Player with MusicBee Power"
authors = ["Arachnid Team"]
edition = "2021"

[lib]
name = "arachnid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
tauri = { version = "2.0", features = [] }
tauri-plugin-opener = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
discord-presence = { version = "0.5", optional = true }
lofty = "0.21"
walkdir = "2.4"
