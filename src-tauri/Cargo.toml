[package]
name = "arachnid"
version = "0.4.115"
description = "Arachnid Music Player - Modern Material You 3 Player with MusicBee Power"
authors = ["sssHpion007"]
edition = "2021"

[lib]
name = "arachnid_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.12.5", features = ["protocol-asset", "tray-icon"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.37", features = ["bundled", "collation", "blob"] }
jpeg-decoder = "0.3"
jpeg-encoder = "0.7"
png = "0.17"
unicode-normalization = "0.1"
sha2 = "0.10"
lofty = "0.21"
walkdir = "2.4"
base64 = "0.22"
rfd = "0.15"
ureq = { version = "2.10", default-features = false, features = ["tls", "native-certs"] }
rodio = { version = "0.20", features = ["symphonia-all"] }

[target.'cfg(target_os = "windows")'.dependencies]
webview2-com = "0.39"
windows-core = "0.62"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
