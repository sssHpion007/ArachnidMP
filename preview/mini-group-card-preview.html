<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="dark" />
    <title>Превью карточки группы в мини-плеере</title>
    <style>
      :root { font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #f4f1fa; background: #131715; }
      * { box-sizing: border-box; }
      body { margin: 0; min-width: 320px; min-height: 100vh; background: radial-gradient(ellipse at 50% 0%, #26332e 0, #131715 55%); }
      button { color: inherit; font: inherit; }
      #root { min-height: 100vh; }
      .demo { min-height: 100vh; display: grid; place-items: center; padding: 28px; }
      .preview { width: min(100%, 520px); padding: 26px; border: 1px solid rgba(255,255,255,.08); border-radius: 24px; background: rgba(22,27,25,.88); box-shadow: 0 28px 90px rgba(0,0,0,.4); }
      .eyebrow { margin-bottom: 7px; color: #9ca8a2; font-size: 10px; font-weight: 800; letter-spacing: .16em; text-transform: uppercase; }
      h1 { margin: 0; font-size: 19px; letter-spacing: -.025em; }
      .description { margin: 8px 0 23px; color: #a7b0ab; font-size: 12px; line-height: 1.55; }
      .mini-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 10px; max-width: 380px; }
      .group-card { --accent: #58a790; position: relative; display: flex; aspect-ratio: 1; min-width: 0; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; border: 1px solid rgba(255,255,255,.05); border-radius: 16px; background: color-mix(in srgb, var(--accent) 35%, #111614); transition: transform 160ms ease, background-color 160ms ease; }
      .group-card:hover { transform: scale(1.02); }
      .group-icon { width: 38px; height: 38px; color: var(--accent); }
      .group-copy { position: absolute; right: 10px; bottom: 10px; left: 10px; min-width: 0; }
      .group-name { overflow: hidden; color: #f3f5f3; font-size: 12px; font-weight: 700; text-overflow: ellipsis; white-space: nowrap; }
      .group-count { margin-top: 3px; color: rgba(235,241,237,.7); font-size: 10px; }
      .palette { display: flex; flex-wrap: wrap; gap: 9px; margin-top: 20px; }
      .color-choice { width: 24px; height: 24px; padding: 0; border: 2px solid transparent; border-radius: 50%; cursor: pointer; }
      .color-choice[aria-pressed="true"] { border-color: #f5f5f5; box-shadow: 0 0 0 2px rgba(255,255,255,.15); }
      .note { margin: 17px 0 0; color: #828c86; font-size: 10px; line-height: 1.5; }
      @media (max-width: 420px) { .preview { padding: 18px; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/previews/MiniGroupCardPreview.tsx"></script>
  </body>
</html>
